<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Camp Clearer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111;
        --panel: rgba(18, 18, 22, 0.88);
        --line: #4a4a52;
        --text: #e8e8e8;
        --dim: #a3a3ab;
        --accent: #ffd250;
        --good: #6fcf7f;
        --bad: #ff8a80;
        --blue: #9cc4ff;
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
      #game { position: fixed; inset: 0; touch-action: none; }
      #game canvas { display: block; outline: none; }
      #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
      #ui button, #ui a, #ui input, #ui .list { pointer-events: auto; }
      button { font: inherit; color: var(--text); background: #2b2b33; border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem; cursor: pointer; }
      button:hover:not(:disabled) { border-color: #8a8a94; }
      button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      a { color: var(--blue); }

      /* --- top bar --- */
      #topbar { display: flex; gap: .75rem; justify-content: space-between; align-items: flex-start; padding: .5rem .75rem; padding-top: max(.5rem, env(safe-area-inset-top)); background: linear-gradient(var(--panel), rgba(18,18,22,.6)); }
      #stats { display: grid; gap: .1rem; min-width: 0; }
      #stats .big { font-size: 1.05rem; font-weight: 600; }
      #state { color: var(--accent); }
      #turn { color: var(--blue); }
      #piles, #progress { color: var(--dim); font-size: .85rem; }
      #feedback { color: var(--bad); font-size: .9rem; min-height: 1.4em; }
      /* fixed line heights: the top bar must not change size when a fight starts, or the framing it was measured for goes stale */
      #stats > div { line-height: 1.4; }
      #state, #turn, #piles, #progress { min-height: 1.4em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #meta { display: flex; flex-wrap: wrap; gap: .4rem; justify-content: flex-end; align-items: center; }
      #savePill { font-size: .8rem; padding: .25rem .55rem; border-radius: 999px; border: 1px solid var(--line); background: #1c1c22; pointer-events: auto; white-space: nowrap; }
      #savePill.ok { color: var(--good); border-color: #3c6b44; }
      #savePill.busy { color: var(--accent); }
      #savePill.bad { color: var(--bad); border-color: #7a3b37; }
      #meta a, #meta button { font-size: .85rem; padding: .3rem .7rem; min-height: 2.5rem; box-sizing: border-box; display: inline-flex; align-items: center; }
      #meta #savePill { min-height: 2.5rem; }
      #meta a { border: 1px solid var(--line); border-radius: 8px; text-decoration: none; background: #2b2b33; }

      /* --- side list (fight participants that don't fit on stage) --- */
      #overflow { position: fixed; right: .75rem; width: 15rem; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .4rem; }
      #overflow h2 { font-size: .8rem; margin: .1rem .2rem .3rem; color: var(--dim); font-weight: 500; }
      #overflow .list { display: grid; gap: .25rem; max-height: 9.5rem; overflow-y: auto; }
      #overflow button { text-align: left; font-size: .8rem; padding: .3rem .45rem; }
      #overflow button[aria-pressed="true"] { background: #5a4f1a; border-color: var(--accent); }

      /* --- bottom dock --- */
      #dock { padding: .5rem .75rem; padding-bottom: max(.5rem, env(safe-area-inset-bottom)); background: linear-gradient(rgba(18,18,22,.6), var(--panel)); }
      #hint { color: var(--dim); font-size: .85rem; margin-bottom: .35rem; }
      #fightRow { display: flex; gap: .6rem; align-items: stretch; }
      #hand { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .5rem; flex: 1; max-width: 44rem; }
      /* fixed height: the dock must be the same size whatever the cards say, or a fight's framing goes stale */
      .card { display: flex; flex-direction: column; gap: .25rem; align-items: flex-start; text-align: left; height: 6.6rem; overflow: hidden; box-sizing: border-box; background: #2e3a52; border-color: #8090b0; }
      .card .name { font-weight: 600; }
      .card .cost { color: var(--accent); font-size: .85rem; }
      .card .blurb { color: #cfd6e4; font-size: .82rem; }
      .card.empty { visibility: hidden; }
      .card.cant { background: #26262c; border-color: #4a4a52; }
      #actions { display: grid; gap: .4rem; min-width: 9rem; }
      #endTurn:not(:disabled) { background: #2f5a35; border-color: #6fcf7f; }
      #flee:not(:disabled) { background: #5a2f2f; border-color: #e08080; }
      #actions small { display: block; color: var(--dim); font-size: .72rem; }
      body:not(.fighting) #fightRow { display: none; }
      body.fighting #hint { display: none; }

      /* --- modal screens --- */
      #screen { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8, 8, 10, .72); pointer-events: auto; padding: 1rem; }
      #screen[hidden] { display: none; }
      #panel { width: min(34rem, 100%); max-height: 100%; overflow-y: auto; background: #1b1b21; border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1.25rem 1rem; box-sizing: border-box; }
      #panel h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
      #panel h2 { font-size: 1rem; margin: 1rem 0 .3rem; }
      #panel p, #panel li { color: #cfcfd6; }
      #panel ul { padding-left: 1.2rem; margin: .3rem 0; }
      #panel .buttons { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
      #panel .primary { background: #2f5a35; border-color: var(--good); font-weight: 600; }
      #panel .danger { background: #4a2626; border-color: #a05050; }
      #panel .summary { background: #24242c; border-radius: 8px; padding: .6rem .8rem; margin: .5rem 0; }
      #panel .note { font-size: .82rem; color: var(--dim); }
      #panel input { font: inherit; padding: .45rem .6rem; border-radius: 8px; border: 1px solid var(--line); background: #111; color: var(--text); width: 8rem; }
      #panel table { width: 100%; border-collapse: collapse; font-size: .85rem; }
      #panel td, #panel th { text-align: left; padding: .2rem .3rem; border-bottom: 1px solid #2c2c34; }

      /* --- phones --- */
      @media (max-width: 640px) {
        :root { font-size: 14px; }
        /* fixed shape on phones: buttons on their own row, then one line per stat, so the
           bar is the same height exploring and fighting (fight framing is measured from it) */
        #topbar { padding: .4rem .5rem; flex-direction: column-reverse; align-items: stretch; gap: .3rem; }
        #meta { justify-content: flex-end; flex-wrap: nowrap; }
        #meta a, #meta button, #meta #savePill { min-height: 2.4rem; font-size: .8rem; }
        #stats .big { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #stats .big { font-size: .95rem; }
        #overflow { left: .5rem; right: .5rem; width: auto; }
        #overflow .list { grid-template-columns: 1fr 1fr; max-height: 5.6rem; }
        #fightRow { flex-direction: column-reverse; gap: .4rem; }
        #actions { grid-template-columns: 1fr 1fr; min-width: 0; }
        #hand { gap: .3rem; max-width: none; }
        .card { height: 8rem; padding: .35rem .4rem; }
        .card .blurb { font-size: .75rem; }
        #dock { padding: .4rem .5rem; padding-bottom: max(.4rem, env(safe-area-inset-bottom)); }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui">
      <header id="topbar">
        <div id="stats">
          <div class="big"><span id="hp">HP</span> · <span id="energy"></span></div>
          <div id="state"></div>
          <div id="turn"></div>
          <div id="piles"></div>
          <div id="progress"></div>
          <div id="feedback" role="status" aria-live="polite"></div>
        </div>
        <div id="meta">
          <button id="savePill" type="button" aria-live="polite">Loading…</button>
          <a href="/readme/" target="_blank" rel="noopener">README</a>
          <button id="menuBtn" type="button">Menu</button>
        </div>
      </header>
      <aside id="overflow" hidden aria-label="More enemies in this fight">
        <h2 id="overflowTitle"></h2>
        <div class="list" id="overflowList"></div>
      </aside>
      <footer id="dock">
        <div id="hint"></div>
        <div id="fightRow">
          <div id="hand" aria-label="Your hand"></div>
          <div id="actions">
            <button id="endTurn" type="button">End turn <small>Space</small></button>
            <button id="flee" type="button">Flee <small>F · enemies act first</small></button>
          </div>
        </div>
      </footer>
    </div>
    <div id="screen" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
      <div id="panel"><h1 id="panelTitle">Camp Clearer</h1><p>Loading your save…</p></div>
    </div>
    <noscript><p style="padding:1rem">This game needs JavaScript. <a href="/readme/">Read about it here.</a></p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
