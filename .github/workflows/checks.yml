name: checks

on:
  push:
    branches: [main]
  pull_request:
  # /ship dispatches a run after flipping the repo public, since the flip
  # itself triggers no push event.
  workflow_dispatch:

# One deploy at a time, and never cancel one mid-flight.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    # Runs once the repo is public; until then `pnpm check` is the same
    # sensors, locally.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the secret scan can see all commits
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build and start the app
        # the same image Fly deploys, with a throwaway /data in place of the
        # volume; the spec runs against it
        run: |
          docker build -t app .
          docker run -d --init --name app -p 8080:8080 -e PORT=8080 --tmpfs /data app
      - name: Run the spec
        run: pnpm check
        env:
          APP_URL: http://localhost:8080
      - name: Play the production image in Chrome
        # viewports includes a real fight, save/reload and visitor isolation
        # at desktop and touch-phone sizes; no development test encounters.
        run: pnpm check:browser http://localhost:8080/
        env:
          SHOTS: artifacts/browser
      - name: Verify the production page and save API
        run: pnpm check:deploy -- http://localhost:8080/
      - name: Play a real co-op session against the production image
        # Two real WebSocket clients: independent cards/common end-turn,
        # a reconnect's action-seq stays valid, one flees while the other
        # continues. Restart-dependent co-op scenarios (fight persistence,
        # fight-id collisions, legacy-format compat) are NOT run here: this
        # job's container uses --tmpfs /data, which does not survive a
        # `docker restart` (confirmed directly in this project), so a
        # restart test here would prove nothing — see tools/coop-restart-check.sh,
        # run locally/pre-release instead, same as tools/persistence-check.sh.
        run: pnpm check:coop http://localhost:8080
      - name: Check a crafted nickname never executes as markup
        # Real headless Chrome: a crafted display name is never created as a
        # live element and never executes, including as an attack-intent
        # target; a normal Chinese/space name still displays as typed.
        run: pnpm check:xss http://localhost:8080
      - name: Check business logging fires with distinct, safe actor ids
        # Spawns its own server/index.ts process (in a fresh temp data dir,
        # not this job's container) since that's the only way to prove its
        # own logging — not just CoopServer's, which already has unit-test
        # seams — actually fires. Drives two real identities through a real
        # action/rejection/flee/reconnect sequence plus a solo save write,
        # then asserts the server's own captured stdout contains the
        # expected event types with distinct actor ids and no raw cookie or
        # stolen card content.
        run: pnpm check:log
      - name: Check a party wipe shows a clear, persistent end-of-expedition state
        # Real headless Chrome, desktop and phone viewports: a solo player is
        # deterministically worn down by west-1's own attack (no RNG in
        # damage) to a real 0-HP wipe, then asserts a persistent panel
        # appears (not just a transient status line) with a working button
        # that starts a fresh expedition via the existing create-room flow.
        run: pnpm check:wipe http://localhost:8080
      - name: Keep browser screenshots and results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ github.sha }}
          path: artifacts/browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Show the app's output
        # what the container printed, so a crash or slow boot is visible
        if: ${{ failure() }}
        run: docker logs app
      - name: Check the process evidence
        # skipped in the template repo itself, where PROCESS.md is still the
        # boilerplate every student replaces
        if: ${{ !github.event.repository.is_template }}
        run: pnpm check:evidence
      - name: Scan for committed secrets
        # Pinned in both halves (action SHA and scanner image) because this
        # runs in every repo in the course. Bump between semesters.
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: --only-verified
      - name: Scan for a committed course key
        # A course key has no verifier a runner can reach, so this pass
        # matches its shape instead (.github/trufflehog.yml).
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          version: "3.96.0"
          extra_args: >-
            --config=.github/trufflehog.yml
            --include-detectors=CustomRegex --results=unverified
            --no-verification

  deploy:
    needs: check
    # The template repo itself has no Fly app; only student repos deploy.
    if: ${{ !github.event.repository.private && !github.event.repository.is_template && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # Registers the GitHub Deployment with the live URL. The app is named
    # after this repo, so the URL needs no lookup.
    environment:
      name: fly
      url: https://${{ github.event.repository.name }}.fly.dev
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      APP_URL: https://${{ github.event.repository.name }}.fly.dev
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - name: Deploy
        # --remote-only builds the Dockerfile on Fly's builders; --ha=false
        # keeps the app at one machine and one volume.
        run: flyctl deploy --remote-only --ha=false -a ${{ github.event.repository.name }}
      - name: Verify deployed assets, README and saved trace
        run: |
          mkdir -p artifacts/deploy
          pnpm check:deploy -- "$APP_URL" 2>&1 | tee artifacts/deploy/checks.log
      - name: Keep the deployment verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-${{ github.sha }}
          path: artifacts/deploy/
          if-no-files-found: warn
          retention-days: 14
